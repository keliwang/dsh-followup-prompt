# npm is published locally (`npm version patch && npm publish && git push --follow-tags`).
# Pushing the vX.Y.Z tag then creates the matching GitHub release with the packed tarball.
# A tag with a `-` suffix (v0.2.0-rc.1) is marked as a prerelease.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release create

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # pnpm is only needed by the pack test.
      - run: npm install -g pnpm

      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: npm run deps:ci
      - run: npm test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dsh-followup-prompt-*.tgz \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${flags[@]}"
